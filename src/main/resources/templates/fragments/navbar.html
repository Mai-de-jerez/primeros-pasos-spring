<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <nav th:fragment="nav-comun" class="navbar navbar-expand-lg navbar-dark navbar-marca shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="fa-solid fa-meteor me-2"></i>Universo Inmerso
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Experiencias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Autobús</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Comunidad</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <th:block th:if="${#authentication.principal != 'anonymousUser'}">
                        <span class="text-light small">
                            <i class="fa-solid fa-user-circle me-1 text-muted"></i>
                            Hola, <strong th:text="${#authentication.name}">Usuario</strong>
                        </span>
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-2">
                                <i class="fa-solid fa-right-from-bracket"></i> Salir
                            </button>
                        </form>
                    </th:block>

                    <th:block th:unless="${#authentication.principal != 'anonymousUser'}">
                        <a th:href="@{/registro}" class="btn btn-registrate btn-sm">
                            <i class="fa-solid fa-user-plus me-1"></i> Regístrate
                        </a>
                        <a th:href="@{/login}" class="nav-link">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Inicia sesión
                        </a>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
