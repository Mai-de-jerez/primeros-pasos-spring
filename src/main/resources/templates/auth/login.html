<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head-comun('Iniciar Sesión')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4 backend-login-card">
        <div class="card-body">
            <!-- Icono superior con Font Awesome -->
            <div class="text-center mb-4">
                <i class="fa-solid fa-shield-halved fa-3x text-primary"></i>
                <h2 class="mt-3 h4">Acceso al Sistema</h2>
            </div>

            <!-- Formulario con control de errores de Spring Security -->
            <form th:action="@{/login}" method="post">
                
                <!-- Mensaje de error si falla la autenticación -->
                <div th:if="${param.error}" class="alert alert-danger p-2 small" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i> Credenciales incorrectas.
                </div>
				<!-- Mensaje de éxito si no falla la autenticación -->
				<div th:if="${param.registroExitoso}" class="alert alert-success p-2 small" role="alert">
                    <i class="fa-solid fa-circle-check me-2"></i> Registro completado. Ya puedes iniciar sesión.
                </div>

                <!-- Campo Usuario -->
                <div class="mb-3">
                    <label for="username" class="form-label text-secondary small">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Introduce tu usuario" required autofocus>
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="mb-4">
                    <label for="password" class="form-label text-secondary small">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
                </button>
            </form>
        </div>
    </div>

</body>
</html>
