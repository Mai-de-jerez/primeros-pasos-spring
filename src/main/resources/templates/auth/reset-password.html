<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Universo Inmerso - Reset Password</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card shadow-sm p-4 backend-login-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock-open fa-3x text-primary"></i>
                <h2 class="mt-3 h4">Nueva Contraseña</h2>
            </div>

            <div th:if="${error}" class="alert alert-danger p-2 small" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" th:object="${nuevaPasswordDto}" method="post" novalidate>

                <input type="hidden" th:field="*{token}">

                <div class="mb-3">
                    <label for="password" class="form-label text-secondary small">Nueva contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="password" th:field="*{password}" 
                               class="form-control" 
                               th:classappend="${#fields.hasErrors('password')} ? 'border-danger'"
                               placeholder="••••••••" autocomplete="new-password">
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:text="${#fields.errors('password')[0]}"></div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword" class="form-label text-secondary small">Confirmar contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" 
                               class="form-control" 
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-danger'"
                               placeholder="••••••••" autocomplete="new-password">
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}" th:text="${#fields.errors('confirmPassword')[0]}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="fa-solid fa-check me-2"></i>Cambiar contraseña
                </button>
            </form>
        </div>
    </div>
	<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
