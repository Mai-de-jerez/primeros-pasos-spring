<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Universo Inmerso - Recuperación Password</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="card shadow-sm p-4 backend-login-card">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="fa-solid fa-key fa-3x text-primary"></i>
                <h2 class="mt-3 h4">Recuperar Contraseña</h2>
            </div>

            <div th:if="${mensaje}" class="alert alert-success p-2 small" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${mensaje}"></span>
            </div>

            <form th:action="@{/recuperar-password}" th:object="${solicitarResetDto}" method="post" novalidate>

                <div class="mb-4">
                    <label for="email" class="form-label text-secondary small">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" id="email" th:field="*{email}" 
                               class="form-control" 
                               th:classappend="${#fields.hasErrors('email')} ? 'border-danger'"
                               placeholder="tu@email.com" autocomplete="email">
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('email')}" th:text="${#fields.errors('email')[0]}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="fa-solid fa-paper-plane me-2"></i>Enviar enlace
                </button>
            </form>

            <p class="text-center mt-3 small">
                <a th:href="@{/login}">Volver a inicio de sesión</a>
            </p>
        </div>
    </div>
	<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
